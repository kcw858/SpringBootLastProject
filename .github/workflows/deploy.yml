name: Deploy With Docker to AWS Server
# 실행조건
on:
  push:
    # main으로 Commit & Push인 경우
    branches:
      - main #main commit and push = [main,master]
jobs:
  deploy:
    # github Actions가 제공하는 ubuntu환경에서 실행
    # AWS EC2가 아닌 Github Actions가 임시로 사용하는 ubuntu
    runs-on: ubuntu-latest

    # 실행순서 지정
    # name => stage, step(jenkins)
    steps:
     #어떤 소스를 가지고 올건지 => src/build.gradle gradlew Ddocketfile
     #코드 체크 (Repository)
     - name: Checkout:repository
       uses: actions/checkout@v4
     #JDK 설정 => SpringBoot프로젝트를 build => JDK 설정
     - name: SetUp JDK 21
       uses: actions/setup-java@v4
       with:
         # 가장 최소단위 JDK = 이클립스 jdk사용
         distribution: 'temurin'
         java-version: '21'
     #환경설정 시작
     #DB관련 => .env
     - name: 환경설정
       run: |
         #기존파일 삭제
         rm -f .env
         #새로운 .env 생성
         touch .env
         echo "DB_URL=${{secrets.DB_URL}}" >> .env
         echo "DB_USERNAME=${{secrets.DB_USERNAME}}" >> .env
         echo "DB_PASSWORD=${{secrets.DB_PASSWORD}}" >> .env
         
     # Gradlew 권한 부여 
     - name: Set gradlew permission
       run: |
         chmod +x ./gradlew
     # Gradle Build 
     - name: Build with Gradlew
       run: ./gradlew clean build -x test
     #Dockerhub에 연결 = 로그인 처리
     - name: docker hub 로그인
       run: |
         echo "${{secrets.DOCKER_PASSWORD}}" | docker login \
         -u "${{secrets.DOCKER_USERNAME}}" \
         --password-stdin
     #Docker Image 생성
     - name: Build Docker Image 생성
       run: |
         docker build -t ${{secrets.DOCKER_USERNAME}}/last-app:latest
     #Docker Hub Push
     - name: Docker Push
       run: |
         docker push ${{secrets.DOCKER_USERNAME}}/last-app:latest
     # AWS 연결 => Docker Hub 데이터 Pull 
     - name: Set SSH key Permission
       run: |
         mkdir -p ~/.ssh
         echo "${{secrets.SERVER_SSH_KEY}}" > ~/.ssh/id_ed25519
         chmod 600 ~/.ssh/id_ed25519
     # ADD SSH Key 
     - name: Add SSH Key 
       uses: webfactory/ssh-agent@v0.5.3
       with:
         ssh-private-key: ${{secrets.SERVER_SSH_KEY}}
     # Add Known_hosts
     - name: Add Known_hosts
       run: |
         ssh-keyscan -H ed25519 15.164.49.76 >> ~/.ssh/known_hosts
     # Jar파일을 AWS 전송 => Docker이미지 
     - name: Deploy to Server with rsync 
       run: |
         rsync -avz -e "ssh -o StrictHostKeyChecking=no" build/libs/*.jar ubuntu@3.34.45.90:~/app
     # 9090 포트 Kill => container 삭제 
     - name: Run command 
       run: |
         ssh -i ~/.ssh/id_ed25519 ubuntu@3.34.45.90 << 'EOF'
           pkill -f 'java -jar' || true 
           set -a 
           source ~/app/.env 
           set +a 
           nohup java -jar ~/app/SpringBootLastProject-0.0.1-SNAPSHOT.jar > log.txt 2>&1 &
         EOF
     # 9090 포트 다시 구동 => docker run

  
